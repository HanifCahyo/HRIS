name: Multi-Environment Pipeline (Dev, Staging, Prod)

on:
  push:
    branches:
      - development
      - staging
      - production

jobs:
  # --- JOB 1: DEVELOPMENT (Hanya Cek Build di Cloud) ---
  build-check:
    name: Build Check (Development)
    if: github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js & PHP
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install & Build Test
        run: |
          cp .env.example .env
          npm install
          npm run build
          # Tambahkan perintah test jika ada, misal: php artisan test

  # --- JOB 2: STAGING (Build di Cloud + Deploy ke Subdomain) ---
  deploy-staging:
    name: Deploy to Staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend
        run: |
          cp .env.example .env
          npm install
          npm run build
      - name: Sync Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build"
          target: ${{ secrets.TARGET_STAGING }} # Mengarah ke sub-domain dev
      - name: Execute Backend Commands via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.TARGET_STAGING }}
            git fetch origin staging
            git reset --hard origin/staging
            php composer.phar install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache

  # --- JOB 3: PRODUCTION (Build di Cloud + Deploy ke Domain Utama) ---
  deploy-production:
    name: Deploy to Production
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend
        run: |
          cp .env.example .env
          npm install
          npm run build
      - name: Sync Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "public/build"
          target: ${{ secrets.TARGET_PROD }} # Mengarah ke domain utama
      - name: Execute Backend Commands via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.TARGET_PROD }}
            git fetch origin production
            git reset --hard origin/production
            php composer.phar install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
